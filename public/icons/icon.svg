<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f6f43"/>
      <stop offset="100%" stop-color="#003d1f"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Building icon -->
  <g fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <polygon points="96,288 256,128 416,288" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="6"/>
    <!-- Building body -->
    <rect x="160" y="288" width="192" height="160" fill="rgba(255,255,255,0.1)" stroke="white" stroke-width="6"/>
    <!-- Door -->
    <rect x="224" y="368" width="64" height="80" fill="rgba(255,255,255,0.2)" stroke="white" stroke-width="4"/>
    <!-- Windows row 1 -->
    <rect x="180" y="308" width="36" height="36" rx="4" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="3"/>
    <rect x="296" y="308" width="36" height="36" rx="4" fill="rgba(255,255,255,0.25)" stroke="white" stroke-width="3"/>
    <!-- Windows row 2 -->
    <rect x="180" y="360" width="36" height="36" rx="4" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
    <rect x="296" y="360" width="36" height="36" rx="4" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="3"/>
  </g>
  <!-- Text: AT -->
  <text x="256" y="472" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">AT</text>
</svg>
