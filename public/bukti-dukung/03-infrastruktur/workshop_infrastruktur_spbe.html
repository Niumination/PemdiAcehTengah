<script type="text/javascript">

    CMS.Loaded(function(){
        fetch("/cuaca.json").then(function (response) {
            if (response.status != 200) {
                console.log("JSON Cuaca sedang tidak dapat diakses.")
                return;
            }

            response.json().then(function (data) {
                let kota_id = (CMS_Setting('theme_config')['kota_id'] === "") ? '501397'
                    : (CMS_Setting('theme_config')['kota_id'] == null) ? '501397'
                        : CMS_Setting('theme_config')['kota_id'];
                let date = Object.keys(data[kota_id])[1];
                let h = new Date().getHours();

                const filter = Object.assign({}, ...data[kota_id][date].filter(data => h >= data.hour && h < data.hour + 6));
                let kota = data[kota_id]['kota'];
                let icon = filter.icon;
                let suhu = filter.suhu;
                let cuaca = '<img src="/assets/img/cuaca/' + icon + '.svg" class="weather-icon icon">';

                
                $('#temperatur').text(suhu);
                $('#weather-area').text(kota);
                $('#icon-weather').html(cuaca);

            })
        })
    });
    // Attach listener function on state changes

    $(function () {
        $('[data-toggle="tooltip"]').tooltip()
    })

    CMS.Loaded(function(){
        window.instgrm.Embeds.process();
        //Pengecekan SearchInput dan Disable Button 
        $('#search').keyup(function(){
          if($(this).val().length > 0 ){
            $('#btn-search').removeAttr("disabled");
          }else{
            $('#btn-search').attr('disabled', 'disabled');
          }
        });

        $( "#search" ).keypress(function(event) {
            var keyCode = (event.keyCode ? event.keyCode : event.which);
            if (keyCode == 13) {
                search(document.getElementById('search').value);
                document.getElementById('search').value = "";
            }
        });
    });

    CMS.Ready(function(){

        $(".background-popup").fadeOut();

        $(".cms-pejabat").removeClass('cms-list-scroll').addClass("js-carousel");
        $('.cms-pejabat').attr('data-vertical', 'true');
        $('.cms-pejabat').attr('data-autoplay', '4000');
        $('.cms-pejabat').attr('data-infinite', 'true');
        $('.cms-pejabat').attr('data-slides-show', '5');
        $.RFVCore.components.RFVSlickCarousel.init('.js-carousel');
        $('.lazy').lazy({
            delay:1000,
            effect: "fadeIn",
            effectTime: 2000,
            threshold: 0
        }); 
    });
</script>

<script type="text/javascript">

    CMS.Loaded(function(){
        setIcon(CMS_Setting('icon'))

        function sosmed(judul){
            var url = window.location.href,
            facebook = `
                <a href="//www.facebook.com/share.php?u=`+url+`" target="_blank">
                    <img class="alignleft size-full wp-image-664" title="custom-fb-share" src="/themes/_ceudahduplikat/assets/images/facebook.png" alt="" width="24" height="24" />
                </a>`,
            twitter = `
                <a href="//twitter.com/intent/tweet?url=`+url+`&amp;text=`+judul+`" target="_blank">
                    <img class="alignleft size-full wp-image-664" title="custom-twitter-button" src="/themes/_ceudahduplikat/assets/images/twitter.png" alt="" width="24" height="24" />
                </a>`,
            whatsapp = `
                <a href="whatsapp://send?text=`+judul+` `+url+`" target="_blank">
                    <img class="alignleft size-full wp-image-664" title="custom-twitter-button" src="/themes/_ceudahduplikat/assets/images/whatsapp.png" alt="" width="24" height="24" />
                </a>
            `;

            return facebook+twitter+whatsapp;

        }
        var json = '/json' + cleanSlash(window.location.pathname) + '.json?mode=origin';
        fetch(json).then(function(response) {
            if (!response.ok) {
                throw Error(response.statusText);
            }
            return response.json();
        }).then(function(json) {

            var theme_config = CMS_Setting('theme_config')

            if ( segments(1) == 'berita'){

                setTitle("Berita "+ json.judul);

                var kategori = json.kategori;
                var tags = json.tags;

                $(".gambar-caption").append(json.gambar_caption);
                $(".tanggal-berita").html(json.tanggal);
                $(".author-berita").html("Oleh "+json.author);
                $(".meta-kategori").html(kategori.nama);
                $(".meta-kategori").attr("href", kategori.slug);
                $.each(tags, function(index, item) {
                    $(".tags-berita").append("<a href='"+item.slug+"' class='meta-kategori label-putih mr-5px'>"+item.nama+"</a>")
                });

            }

            if (segments(1) == 'halaman'){

                setTitle("Halaman "+ json.judul);

                $(".meta-kategori").css('display','none');
                $(".meta-tags").css('display','none');
                $(".share-link").removeClass('meta-right');
            }

            if (segments(1) == 'halaman' || segments(1) == 'berita'){

                $(".judul-berita").html(json.judul);
                $(".isi-berita").html(json.konten);
                if(json.gambar && theme_config['thumbnail_as_large_image'] !== false){
                    $(".gambar-caption").html("<img class='meta-img' src='/thumbnail/700x0"+json.gambar+"' alt='"+json.gambar_alt+"' title='"+json.gambar_title+"'><small class='text-center text-muted'>"+json.gambar_caption+"</small>");
                }
            }

            if (segments(1) == 'pejabat'){

                setTitle("Pejabat "+ json.nama);

                $(".judul-berita").html(json.nama);
                $(".meta-kategori").html(json.jabatan).attr("href", json.slug_jabatan);
                $(".meta-tags").css('display','none');

                var pendidikan = '<h3 class="title-pejabat">Pendidikan</h3><ul class="pendidikan-pejabat">';
                $.each(json.pendidikan, function(index, item) {
                    pendidikan += "<li><strong>"+item.mulai+"-"+item.akhir+"</strong><br/>"+item.tempat+"</li>"
                });
                pendidikan += '</ul><br/>';

                var pekerjaan = '<h3 class="title-pejabat">Pekerjaan</h3><ul class="pekerjaan-pejabat">';
                $.each(json.pekerjaan, function(index, item) {
                    pekerjaan += "<li><strong>"+item.mulai+"-"+item.akhir+"</strong><br/>"+item.tempat+"</li>"
                });
                pekerjaan += '</ul>';
                var isiberita = `<div class="pejabat">
                    <div class="pejabat-foto text-center mb-3"><img class='meta-foto-pejabat' src='/thumbnail/300x0`+json.gambar+`'
                        alt='`+json.gambar_alt+`' title='`+json.gambar_title+`'/><br/><strong>`+json.jabatan_lengkap+`</strong></div>
                    <div class="pejabat-detail">`+pendidikan+pekerjaan+`</div>
                    </div><p>`+json.deskripsi_pejabat+`</p>`;

                $(".isi-berita").html(isiberita);

            }

            if (segments(1) == 'agenda'){

                setTitle("Agenda "+ json.judul);

                var koordinat = json.koordinat;
                if(koordinat != '~')
                {
                    koordinat = koordinat.split('~');
                    var lat = koordinat[0],
                        lng = koordinat[1];

                    var s = document.createElement("script");
                    s.type = "text/javascript";
                    s.src = "/assets/leaflet/leaflet.js";
                    $("body").append(s);

                    s = document.createElement("link");
                    s.type = "text/css";
                    s.rel = "stylesheet";
                    s.href = "/assets/leaflet/leaflet.css";
                    $("body").append(s);

                    $("<div id='peta-agenda'></div>").insertAfter(".isi-berita");

                    setTimeout(function() {
                        var map = L.map('peta-agenda').setView([lat, lng], 18);

                        L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{
                            maxZoom: 20,
                            attribution: 'Map Data &copy;2019',
                            subdomains:['mt0','mt1','mt2','mt3']
                        }).addTo(map);

                        L.marker([lat, lng]).addTo(map)
                            .bindPopup(json.lokasi).openPopup();

                        var popup = L.popup();

                        $("#peta-agenda").css("width", "auto").css("height", "350px");
                    }, 1000);
                }

                $(".judul-berita").html(json.judul);
                $(".meta-kategori").css('display','none');
                $(".meta-tags").css('display','none');
                $(".share-link").removeClass('meta-right');

                var isi_konten = '<strong>Mulai Tanggal</strong>:<br/>'+json.tanggal_mulai+'<br/><br/>';
                    isi_konten += '<strong>Sampai Tanggal</strong>:<br/>'+json.tanggal_akhir+'<br/><br/>';
                    isi_konten += json.deskripsi;

                $(".isi-berita").html(isi_konten);
            }

            $(".share-link").append(sosmed(json.judul))
            $(".card").fadeIn();

            if (json.show_comments){
                CMS.Comment("#komentar");
            }
        }).catch(function(error) {
            console.error(error);
            $(".daftar-berita").html(Page404());
        });
    });

</script>

</body>
</html>
