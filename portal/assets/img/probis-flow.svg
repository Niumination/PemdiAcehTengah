<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#111827"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)" rx="12"/>

  <!-- Grid -->
  <g opacity="0.03">
    <line x1="0" y1="80" x2="400" y2="80" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="400" y2="320" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="400" y2="400" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="500" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="500" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="500" stroke="#00f0ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="500" stroke="#00f0ff" stroke-width="0.5"/>
  </g>

  <!-- Business Process Flow -->
  <g transform="translate(40, 60)">
    <!-- Level 0 -->
    <rect x="0" y="0" width="320" height="40" rx="6" fill="none" stroke="#f0c000" stroke-width="1.5" opacity="0.6"/>
    <text x="160" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="#f0c000" opacity="0.8">LEVEL 0 — VISI &amp; MISI DAERAH</text>

    <!-- Arrow down -->
    <line x1="160" y1="40" x2="160" y2="55" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
    <polygon points="156,53 160,60 164,53" fill="#00f0ff" opacity="0.3"/>

    <!-- Level 1 -->
    <rect x="0" y="60" width="320" height="60" rx="6" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.5"/>
    <text x="160" y="82" text-anchor="middle" font-family="monospace" font-size="9" fill="#00f0ff" opacity="0.7">LEVEL 1 — 10 PROSES UTAMA</text>
    <rect x="20" y="92" width="60" height="18" rx="3" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <rect x="90" y="92" width="60" height="18" rx="3" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <rect x="160" y="92" width="60" height="18" rx="3" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>
    <rect x="230" y="92" width="60" height="18" rx="3" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.3"/>

    <!-- Arrow down -->
    <line x1="160" y1="120" x2="160" y2="135" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
    <polygon points="156,133 160,140 164,133" fill="#00f0ff" opacity="0.3"/>

    <!-- Level 2 - Cross Functional -->
    <rect x="0" y="140" width="320" height="60" rx="6" fill="none" stroke="#8855ff" stroke-width="1" opacity="0.5"/>
    <text x="160" y="162" text-anchor="middle" font-family="monospace" font-size="9" fill="#8855ff" opacity="0.7">LEVEL 2 — LINTAS FUNGSI (CFM)</text>
    <!-- Process flow arrows -->
    <line x1="30" y1="180" x2="100" y2="180" stroke="#8855ff" stroke-width="0.8" opacity="0.4"/>
    <polygon points="96,177 104,180 96,183" fill="#8855ff" opacity="0.4"/>
    <line x1="140" y1="180" x2="210" y2="180" stroke="#8855ff" stroke-width="0.8" opacity="0.4"/>
    <polygon points="206,177 214,180 206,183" fill="#8855ff" opacity="0.4"/>
    <line x1="250" y1="180" x2="300" y2="180" stroke="#8855ff" stroke-width="0.8" opacity="0.4"/>
    <polygon points="296,177 304,180 296,183" fill="#8855ff" opacity="0.4"/>
    <circle cx="25" cy="180" r="3" fill="#8855ff" opacity="0.5"/>
    <circle cx="120" cy="180" r="3" fill="#8855ff" opacity="0.5"/>
    <circle cx="230" cy="180" r="3" fill="#8855ff" opacity="0.5"/>
    <circle cx="310" cy="180" r="3" fill="#8855ff" opacity="0.5"/>

    <!-- Arrow down to Output -->
    <line x1="160" y1="200" x2="160" y2="215" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
    <polygon points="156,213 160,220 164,213" fill="#00ff88" opacity="0.3"/>

    <!-- Output -->
    <rect x="80" y="220" width="160" height="35" rx="6" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
    <text x="160" y="242" text-anchor="middle" font-family="monospace" font-size="9" fill="#00ff88" opacity="0.7">OUTPUT — LAYANAN PUBLIK</text>
  </g>

  <!-- Title -->
  <text x="200" y="470" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b" opacity="0.6" letter-spacing="3">PETA PROSES BISNIS</text>
</svg>
